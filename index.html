<!DOCTYPE html>
<html lang="vi" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Widget — Thời tiết hôm nay</title>
  <meta name="description" content="Widget thời tiết đơn giản dùng Open-Meteo, không cần API key." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
</head>
<body>
  <main class="page" id="widget" aria-live="polite">
    <p id="error" class="ww-error" hidden></p>

    <div id="content" class="ww-content" hidden>
      <section class="ww-section ww-slider" id="section-hourly">
        <div class="ww-section-head">
          <h2 class="ww-section-title" id="hourly-title">Thời tiết trong 24h tới</h2>
          <button type="button" id="picker-open" class="ww-pin" aria-label="Đổi vị trí" title="Đổi vị trí">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/>
              <circle cx="12" cy="10" r="2.6"/>
            </svg>
          </button>
        </div>
        <button type="button" id="hourly-prev" class="ww-nav ww-nav-prev" aria-label="Xem giờ trước đó" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
        </button>
        <ul id="hourly" class="ww-track"></ul>
        <button type="button" id="hourly-next" class="ww-nav ww-nav-next" aria-label="Xem giờ tiếp theo" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg>
        </button>
      </section>

      <section class="ww-section" id="section-daily">
        <div class="ww-section-head" id="daily-head">
          <h2 class="ww-section-title" id="daily-title">Thời tiết 7 ngày tới</h2>
        </div>
        <ul id="daily" class="ww-daily"></ul>
      </section>
    </div>
  </main>

  <div class="ww-modal" id="picker-dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title" hidden>
    <div class="ww-modal-box">
      <header class="ww-modal-head">
        <div>
          <h2 class="ww-modal-title" id="picker-title">Chọn vị trí trên bản đồ</h2>
          <p class="ww-modal-hint">Chạm vào bản đồ để chọn nơi bạn muốn xem thời tiết.</p>
        </div>
        <button type="button" id="picker-close" class="ww-modal-close" aria-label="Đóng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="ww-map" id="picker-map"></div>

      <footer class="ww-modal-foot">
        <p class="ww-modal-status" id="picker-status" aria-live="polite"></p>
        <div class="ww-modal-actions">
          <button type="button" id="picker-locate" class="ww-btn">Vị trí của tôi</button>
          <button type="button" id="picker-confirm" class="ww-btn ww-btn-primary" disabled>Xem thời tiết</button>
        </div>
      </footer>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/weather-codes.js"></script>
  <script src="js/api.js"></script>
  <script src="js/location-picker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
